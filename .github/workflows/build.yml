name: Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - '*'
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
      - name: Upload Windows x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: windows_x86_64
          path: build/Analyzers/Release/SENTAnalyzer.dll

  macos-universal:
    name: Build macOS Universal (Intel & Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release
      - name: Upload macOS Universal build
        uses: actions/upload-artifact@v4
        with:
          name: macos_universal
          path: build/Analyzers/*

  linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Linux x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: linux_x86_64
          path: build/Analyzers/*

  publish:
    name: Package & Publish Release
    needs: [windows-x86_64, macos-universal, linux-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Release ZIP
        run: |
          cd artifacts
          zip -r ../sent_analyzer_all_platforms.zip .
          cd ..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            sent_analyzer_all_platforms.zip
            artifacts/windows_x86_64/*
            artifacts/macos_universal/*
            artifacts/linux_x86_64/*
