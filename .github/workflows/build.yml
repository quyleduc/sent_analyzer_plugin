name: Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - '*'
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
      - name: Upload Windows x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: windows_x86_64
          path: build/Analyzers/Release/SENTAnalyzer.dll

  macos:
    name: Build macOS (Intel & Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 & arm64
        run: |
          cmake -B build_x86 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build_x86 --config Release
          cmake -B build_arm -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build_arm --config Release
          mkdir -p build_universal
          lipo -create build_x86/Analyzers/*.dylib build_arm/Analyzers/*.dylib -output build_universal/libSENTAnalyzer.dylib || cp build_arm/Analyzers/* build_universal/
      - name: Upload macOS Universal build
        uses: actions/upload-artifact@v4
        with:
          name: macos_universal
          path: build_universal/*

  linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Linux x86_64 build
        uses: actions/upload-artifact@v4
        with:
          name: linux_x86_64
          path: build/Analyzers/*

  publish:
    name: Package & Publish Release
    needs: [windows-x86_64, macos, linux-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Release ZIP
        run: |
          cd artifacts
          zip -r ../sent_analyzer_all_platforms.zip .
          cd ..
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            sent_analyzer_all_platforms.zip \
            artifacts/windows_x86_64/* \
            artifacts/macos_universal/* \
            artifacts/linux_x86_64/* || true
